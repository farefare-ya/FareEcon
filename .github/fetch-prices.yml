name: Fetch Prices

on:
  schedule:
    # Sekali sehari cukup untuk candle harian. Jam 23:30 UTC ≈ 06:30 WIB —
    # setelah bursa AS tutup, bursa Asia belum buka, data harian sudah settle.
    - cron: "30 23 * * *"
  workflow_dispatch: {} # buat tes manual dari tab Actions

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Semua step di job ini jalan dari dalam folder crawler/,
    # karena repo ini gabungan frontend (di root) + backend (di folder ini).
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: crawler/package-lock.json

      - run: npm ci

      - run: npm run fetch-prices
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
